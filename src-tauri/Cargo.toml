[package]
name = "toolbox"
version = "0.1.0"
description = "个人桌面工具箱"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["signal", "process", "user"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
time = { version = "0.3", features = ["formatting"] }

[[test]]
name = "quick_commands"
path = "../tests/test_unit/test_quick_commands/backend.rs"
